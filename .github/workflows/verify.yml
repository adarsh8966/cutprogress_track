# Runs the same gates as `npm run verify`, but as separate steps so a failure
# names the gate that broke rather than just "verify failed".
#
# No secrets and no services are needed. The integration tests run PostgreSQL
# compiled to WASM (PGlite) in-process, and `next build` works without Supabase
# credentials because environment access is lazy and every authenticated route
# is force-dynamic.
name: verify

on:
  pull_request:
  push:
    branches: [main]

# A rapid second push supersedes the first rather than queueing behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # `npm ci`, not `npm install`: CI should fail on a lockfile that has
      # drifted from package.json rather than silently resolving around it.
      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
